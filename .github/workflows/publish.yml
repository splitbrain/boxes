# Build the three Boxes images, and publish them to GHCR on every push to main.
#
# A pull request runs the same thing minus the push: the suites, and a build
# of all three images that goes nowhere. A Dockerfile that no longer builds is
# then a red check rather than a main that cannot publish, and the layer cache
# makes the repeat cheap for a branch that did not touch the image.
#
# One image per process in ARCHITECTURE.md's table:
#
#   ghcr.io/<owner>/boxes/orchestrator   API, dashboard, gateway, Docker client
#   ghcr.io/<owner>/boxes/egress-proxy   the only way out of a session network
#   ghcr.io/<owner>/boxes/session        what a session container runs
#
# The session image is a compose service nowhere -- the orchestrator creates
# session containers at runtime from SESSION_IMAGE -- which is exactly why it
# is published here: a deployment cannot build it out of a checkout it does
# not have.
#
# Everything gets `latest` and an immutable `sha-<short>`. A deployment that
# follows `latest` picks the images up on its own; one that must not move
# under itself pins the sha tag.
#
# A deployment that follows `latest` is also told, rather than left to notice:
# the last job pings a watchtower HTTP API, if the repository is configured
# with one, so a push and a deployment are the same event instead of one
# polling interval apart. It is the pattern splitbrain/blogrng uses, down to
# the secret's name.
#
# The Dockerfiles type-check before they bundle, so an image cannot be built
# from code that fails `tsc`. That is not the same as the tests passing, and
# `latest` is a tag something else deploys unattended, so the test job gates
# the build rather than running beside it.

name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two commits in a row: the second one's images are the ones worth having.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      # Three independent suites: one failing tells you more when the other
      # two have still run.
      fail-fast: false
      matrix:
        package: [orchestrator, proxy, dashboard]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      # ci, not install: the same resolved versions the Dockerfiles build from,
      # including the exactly-pinned assistant-ui packages.
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      # The dashboard's `e2e` project builds the production bundle and drives
      # it in a real Chromium, so the browser has to exist before `npm test`.
      # The `unit` project needs none of this, and neither does anything else
      # in the matrix.
      #
      # `--with-deps` runs `apt-get update` first, and the runner image carries
      # Google's Chrome repository -- which this needs nothing from: every
      # library Playwright's Chromium wants comes out of the Ubuntu archive.
      # That repository has served a `Packages.gz` whose hash did not match the
      # Release file describing it, and apt fails the whole update on one bad
      # index, so a repository Boxes does not use turned main red for as long
      # as Google's mirrors disagreed with each other. Re-running did not help;
      # the mismatch outlived it.
      #
      # So it is taken out of the picture before the install. The glob covers
      # both the `.list` and the deb822 `.sources` spelling, and `rm -f`
      # matching nothing is a success -- an image that stops shipping the
      # repository quietly needs no change here. Only this one repository goes:
      # wiping the directory would be a way to delete the Ubuntu archive itself
      # on an image that keeps it there.
      - name: Install Chromium
        if: matrix.package == 'dashboard'
        working-directory: dashboard
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      - name: Type-check
        working-directory: ${{ matrix.package }}
        run: npm run check

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

  images:
    name: image (${{ matrix.image }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The orchestrator and the proxy build from the repository root:
          # both Dockerfiles copy shared/ next to their own package, so the
          # context has to be the checkout rather than the package directory.
          - image: orchestrator
            context: .
            dockerfile: orchestrator/Dockerfile
          - image: egress-proxy
            context: .
            dockerfile: proxy/Dockerfile
          # The session image copies only entrypoint.sh, so its own directory
          # is the whole context.
          - image: session
            context: session-image
            dockerfile: session-image/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Skipped on a pull request: nothing is pushed there, and a PR from a
      # fork has no token that could log in anyway.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/<repo>/<image>, derived rather than written out, so a
      # fork publishes to its own namespace with nothing to edit. GHCR names
      # must be lowercase and github.repository already is.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=boxes-${{ matrix.image }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Built on a pull request, pushed only once it is on main. The tags
          # are computed either way, so a PR proves the whole step bar the
          # upload.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 is what the deployment host runs. Adding arm64 is one
          # more entry here and roughly triples the session image's build,
          # which installs an apt toolchain and the GitHub CLI.
          platforms: linux/amd64
          # A cache scope per image: one shared scope has the three builds
          # evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # A plain single-platform manifest rather than an OCI index with
          # attestations attached, because a digest is what the deployment's
          # watchtower compares to decide it has something new.
          provenance: false
          sbom: false

  # Tell the deployment its images have moved, rather than leaving it to
  # notice on its next poll. Watchtower's interval is the difference between a
  # push and a deployment, and it is minutes long for no reason once the push
  # can say so itself.
  watchtower:
    name: watchtower
    needs: images
    # Nothing was pushed on a pull request, so there is nothing to pull. A
    # partly failed matrix does not get here either: some of the three images
    # would be new and some would not, and that is a state to fix rather than
    # to deploy. Watchtower's own polling still picks those up.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Both settings are the deployment's, and a fork has neither: without a
      # URL this says so and succeeds, because a fork of this repository
      # publishing to its own namespace has nothing to notify and no business
      # failing over it. WATCHTOWER_URL is a repository variable — it is a
      # host name, not a credential — and the token is the secret, named as it
      # is in splitbrain/blogrng so an organisation secret covers both.
      - name: Ask watchtower to pull what was just published
        env:
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
        # `set -eu` rather than the runner's implicit `bash -e`, so the
        # failure below is the script's own decision and stays that way
        # wherever it is run. The `:-` defaults are for the same reason: a
        # repository with neither setting has both of these as empty strings,
        # and a checkout that has never heard of them should behave the same.
        run: |
          set -eu
          url=${WATCHTOWER_URL:-}
          if [ -z "$url" ]; then
            echo 'No WATCHTOWER_URL variable set; nothing to notify.'
            exit 0
          fi
          # --fail so a refused or misrouted ping is a red check rather than a
          # deployment that quietly stayed where it was. The endpoint answers
          # only once it has pulled and recreated what it watches, which is
          # why the timeout is minutes rather than seconds.
          answer=$(curl --fail --silent --show-error --max-time 300 \
            -X POST "$url" \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN:-}")
          # What it did, which is the only record of this deployment moving.
          printf 'Watchtower answered: %s\n' "$answer"
